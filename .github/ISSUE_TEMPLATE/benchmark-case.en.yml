# Chinese version: benchmark-case.yml
name: 'English: Submit a Labor Scenario (Benchmark Case)'
description: Submit a new labor scenario to expand or improve benchmark questions.
title: '[Benchmark case] '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: '[中文填写入口](https://github.com/EastForce/worker-ai-spark/issues/new?template=benchmark-case.yml)


      ## Before submitting (please read)

      This template provides an accessible way to submit leads about labor scenarios. To submit a complete candidate
      question, use the “Complete Candidate Benchmark Question” template.

      - You may submit real cases based on firsthand experience, direct knowledge or a reasonable factual basis;

      - You may choose no additional name, a pseudonym, or voluntary disclosure of your real name;

      - Without separate authorization, **do not provide company or organization names**;

      - **Do not upload internal files, chat records or product secrets**;

      - **Do not submit experiences or information that identify third parties**;

      - Please **distinguish facts from speculation**;

      - You may use descriptions such as “a factory”, “a platform” or “a region”.

      '
- type: input
  id: category
  attributes:
    label: Suggested category
    description: 'For example: “Working time, wages and labor relations”'
    placeholder: Algorithmic management and worker participation
  validations:
    required: true
- type: textarea
  id: scenario
  attributes:
    label: Scenario description
    description: You may describe a real case. Distinguish firsthand experience, direct knowledge, secondhand accounts
      and speculation; do not identify third parties without authorization.
  validations:
    required: true
- type: dropdown
  id: source-type
  attributes:
    label: Source of background
    options:
    - Firsthand experience
    - Direct knowledge or reasonable factual basis
    - Adapted from public sources
    - Synthesis of multiple public cases, not traceable to a specific individual
    - Entirely hypothetical scenario
  validations:
    required: true
- type: dropdown
  id: public-attribution
  attributes:
    label: Public identity choice for this submission
    description: Your GitHub account is always visible; this choice does not authorize disclosure of your organization,
      contact details or original materials.
    options:
    - Display only my GitHub account, with no additional name in the body
    - Use a pseudonym that I will enter in the body
    - I voluntarily choose to disclose my real name, which I will enter in the body
  validations:
    required: true
- type: textarea
  id: question
  attributes:
    label: Question you want the model to answer
  validations:
    required: true
- type: textarea
  id: fact-vs-speculation
  attributes:
    label: Distinguishing facts from speculation
    description: Distinguish firsthand experience, public facts, speculation and hypotheses; do not describe identifiable
      incidents based on hearsay.
  validations:
    required: true
- type: checkboxes
  id: privacy-check
  attributes:
    label: Privacy self-check
    options:
    - label: Unless I have voluntarily selected real-name disclosure under “Public identity choice”, the body contains
        no real names; it contains no unauthorized organization names
      required: true
    - label: I have not uploaded internal files or chat records
      required: true
    - label: I have not added attachments, screenshots, photographs, recordings or original files
      required: true
    - label: I have distinguished firsthand experience, direct knowledge, secondhand accounts, public sources and
        speculation, and have not identified third parties without authorization
      required: true
    - label: I understand that my selected public identity and the body will remain public over the long term, and
        that the content does not expose anyone without authorization
      required: true
    - label: I have the right to submit this content and agree to its publication under the repository content license,
        CC BY-SA 4.0
      required: true
